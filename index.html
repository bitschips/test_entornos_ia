<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Exámenes"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><title>Gestor de Exámenes</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1 data-i="title">Gestor de Exámenes</h1><p data-i="subtitle">Calendario y calificaciones</p></div><div class="actions"><select id="language" aria-label="Language"><option value="es">Español</option><option value="en">English</option></select><button id="install" hidden>Instalar</button></div></header>
<main><nav><button data-view="calendar" class="active" data-i="calendar">Calendario</button><button data-view="list" data-i="list">Exámenes</button><button data-view="grades" data-i="grades">Calificaciones</button><button data-view="subjects" data-i="subjects">Asignaturas</button></nav>
<section class="toolbar"><button id="newExam" class="primary" data-i="addExam">+ Nuevo examen</button><button id="export" data-i="export">Exportar XML</button><label class="button"><span data-i="import">Importar XML</span><input id="importFile" type="file" accept=".xml,text/xml,application/xml" hidden></label></section>
<section id="calendarView" class="panel"><div class="month"><button id="prev" aria-label="Previous month">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="Next month">›</button></div><div id="calendarGrid" class="grid"></div><h3 id="selectedDate"></h3><div id="dayExams" class="cards"></div></section>
<section id="listView" class="panel" hidden><h2 data-i="allExams">Todos los exámenes</h2><div class="filters"><select id="subjectFilter"></select><select id="statusFilter"><option value="all" data-i="all">Todos</option><option value="pending" data-i="pending">Pendientes</option><option value="done" data-i="done">Realizados</option><option value="cancelled" data-i="cancelled">Cancelados</option></select></div><div id="examList" class="cards"></div></section>
<section id="gradesView" class="panel" hidden><h2 data-i="grades">Calificaciones</h2><div id="gradeSummary" class="cards"></div><div id="gradeList" class="cards"></div></section>
<section id="subjectsView" class="panel" hidden><h2 data-i="subjects">Asignaturas</h2><form id="subjectForm" class="row"><input id="subjectName" required maxlength="70" placeholder="Nueva asignatura"><button class="primary" data-i="add">Añadir</button></form><div id="subjectList" class="cards"></div></section></main>
<dialog id="examDialog"><form id="examForm"><h2 id="formTitle"></h2><input type="hidden" id="examId"><label data-i="subject">Asignatura</label><select id="examSubject" required></select><label data-i="date">Fecha</label><input id="examDate" type="date" required><label data-i="time">Hora (opcional)</label><input id="examTime" type="time"><label data-i="description">Descripción</label><textarea id="examDescription" rows="3" maxlength="500"></textarea><label data-i="grade">Nota (0–10, opcional)</label><input id="examGrade" type="number" min="0" max="10" step="0.01"><label class="check"><input id="examCancelled" type="checkbox"><span data-i="cancelled">Cancelado</span></label><div class="row end"><button type="button" id="closeDialog" data-i="close">Cerrar</button><button class="primary" data-i="save">Guardar</button></div></form></dialog>
<footer><a href="manual_es.md">Manual ES</a> · <a href="manual_en.md">Manual EN</a></footer><script src="app.js" defer></script></body></html>
